defaults:
  project: llama3.2-1b-w8a16
  model: meta-llama/Llama-3.2-1B-Instruct
  device: cuda
  seq_len: 2048
  seed: 0
  save_path: null
  pack: false
  load_packed: null

quantization:
  quantize: true
  quant_method: rtn
  mode: fake
  attn_weight: int8
  mlp_weight: int8
  head_weight: bf16
  activation: bf16        # A16
  kv_cache: bf16
  group_size: 128

evaluation:
  metric: wikitext2
