# Phase 1: compare bit combinations. Every run goes through the same pipeline as
# examples/run.py -- the sweep only expands this one config into N of them.
defaults:
  project: phase1-sweep
  model: meta-llama/Llama-3.2-1B-Instruct
  device: cuda
  seq_len: 2048
  seed: 0

quantization:
  quantize: true
  quant_method: rtn
  mode: fake
  kv_cache: bf16
  group_size: 128

evaluation:
  # accuracy = generation tasks. The model writes tokens and they are matched against
  # known answers, so this is an absolute score on the real decode path.
  tasks: [arc_easy, arc_challenge, openbookqa]
  task_limit: 300         # 300 keeps a 24-run grid near an hour; null uses each task default
  ppl: true               # secondary: cheap and comparable, but teacher-forced
  metric: wikitext2
  # The fake path says nothing about speed, so it does not measure it. Weights are stored
  # already dequantized, so every combination runs the same bf16 GEMM and moves the same
  # bytes: TPS is flat by construction, and TTFT is worse than flat -- it moves only with
  # activation (~48 -> ~85ms) and KV cache (~48 -> ~59ms) quantization, timing the wall
  # clock of simulating them. Ranking on that ranks how much fake work a run does.
  # Speed belongs to stage 4, which re-measures the selected combination on mode=kernel.
  # Here: accuracy and bits per element, which the fake path does report honestly.
  latency: false
  generation: true        # stage 2 on the shortlist: LAMBADA + agreement with bf16
  lambada_limit: 500
  max_new_tokens: 64

selection:
  # decode traffic is weights plus the whole KV cache, so it depends on the context length
  # you care about. At 2k the weights dominate; past a few thousand the cache does.
  context_tokens: 2048
  # 15% rather than 5%: the goal here is the smallest weights that still generate, so the
  # limit is a "does it still work" gate, not a quality bar. 15% admits attn=int8/mlp=int4
  # (-11.64%) and excludes every int4-attention combination (-30% and worse), which on a
  # four-way multiple choice scores near the 0.25 of random guessing.
  acc_drop_limit_pct: 15.0
  # priority: decode throughput > prefill latency > accuracy, and inside the limit the
  # ranking is driven by bits per element -- the smallest weights that still generate.
  decode_speed_weight: 4.0    # scores decode_gb_at_context, the throughput proxy
  prefill_speed_weight: 2.0   # scores TTFT, but only on a real/kernel/packed run
  accuracy_weight: 1.0
  bpv_weight: 3.0             # raised from 0.5: BPE is now what separates the survivors

sweep:
  attn_weight: [int4, int8]
  mlp_weight: [int4, int8]
  # activation is NOT swept: it is held at bf16 above. No mode in this repo runs an
  # int8 x int8 matmul -- fake quantize-dequantizes then multiplies in bf16, real
  # multiplies in fp32 for exactness, and the kernel is weight-only and reads the
  # activation scheme only to print a label. So int8 here costs +0.97% accuracy and
  # moves BPV and decode traffic by exactly 0.00. Sweeping it doubled the grid to
  # measure nothing.
  # head_weight is a real two-way choice and int4 is not offered on it (QuantConfig
  # rejects it): lm_head writes the distribution the sampler reads. int8 measured +8.5%
  # decode for no accuracy cost, so both sides are worth carrying through the grid.
  head_weight: [bf16, int8]
  # kv_cache is held at bf16. int4 is rejected outright, and int8 buys +1.28% accuracy
  # while costing 32% of decode throughput on the kernel path -- already measured, and
  # not a trade this grid needs to re-discover. int8 becomes interesting at long context
  # or in batch, neither of which this sweep measures.
