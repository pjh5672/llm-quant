# Phase 1: compare bit combinations. Every run goes through the same pipeline as
# examples/auto_llm.py -- the sweep only expands this one config into N of them.
defaults:
  project: phase1-sweep
  model: meta-llama/Llama-3.2-1B-Instruct
  device: cuda
  seq_len: 2048
  seed: 0

quantization:
  quantize: true
  quant_method: rtn
  mode: fake
  kv_cache: bf16
  group_size: 128

evaluation:
  # accuracy = generation tasks. The model writes tokens and they are matched against
  # known answers, so this is an absolute score on the real decode path.
  tasks: [arc_easy, arc_challenge, openbookqa]
  task_limit: 300         # 300 keeps a 24-run grid near an hour; null uses each task default
  ppl: true               # secondary: cheap and comparable, but teacher-forced
  metric: wikitext2
  # TTFT and TPS are measured and reported, but they cannot separate the combinations yet:
  # every one stores dequantized bf16 weights, so they move the same bytes and run the same
  # bf16 GEMM. Shown anyway -- a flat column is a result, not a gap. The score uses the
  # analytic decode traffic instead, which does separate them.
  # TPS is flat as predicted. TTFT is NOT: it is flat across weight dtypes but moves with
  # activation (~48 -> ~85ms) and KV cache (~48 -> ~59ms) quantization, because the fake
  # path pays real wall time to simulate them. That is simulation overhead, not prefill,
  # so the score drops it on this path -- see analysis.prefill_is_measurable.
  latency: true
  latency_prompt_tokens: 512
  latency_new_tokens: 64
  generation: true        # stage 2 on the shortlist: LAMBADA + agreement with bf16
  lambada_limit: 500
  max_new_tokens: 64

selection:
  # decode traffic is weights plus the whole KV cache, so it depends on the context length
  # you care about. At 2k the weights dominate; past a few thousand the cache does.
  context_tokens: 2048
  acc_drop_limit_pct: 5.0     # hard guard; the weights only rank what passes it
  # priority: decode throughput > prefill latency > accuracy
  decode_speed_weight: 4.0    # scores decode_gb_at_context, the throughput proxy
  prefill_speed_weight: 2.0   # scores TTFT, but only on a real/kernel/packed run
  accuracy_weight: 1.0
  bpv_weight: 0.5             # near-collinear with decode traffic, kept as a tie-breaker

sweep:
  attn_weight: [int4, int8]
  mlp_weight: [int4, int8]
  activation: [bf16, int8]
  # int4 is not offered: it costs +23.23% accuracy alone and drops below random guessing
  # when combined with int4 MLP weights. QuantConfig rejects it.
  kv_cache: [bf16, int8]
  # head_weight is held at bf16: three independent sweeps put its accuracy effect at ~0,
  # and its real trade-off (disk +252MB vs decode -262MB per token) is already known
  # analytically. Add it back here if that trade-off needs re-measuring.
