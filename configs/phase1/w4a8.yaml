defaults:
  project: llama3.2-1b-w4a8
  model: meta-llama/Llama-3.2-1B-Instruct
  device: cuda
  seq_len: 2048
  seed: 0
  save_path: null
  pack: false
  load_packed: null

quantization:
  quantize: true
  quant_method: rtn
  mode: fake              # fake | real (Phase 2) | kernel (Phase 4)
  attn_weight: int4       # self_attn.{q,k,v,o}_proj
  mlp_weight: int4        # mlp.{gate,up,down}_proj
  head_weight: bf16       # lm_head
  activation: int8        # input of every quantized Linear above
  kv_cache: bf16          # reserved, not implemented yet
  group_size: 128         # shared by weights and activations

evaluation:
  metric: wikitext2
