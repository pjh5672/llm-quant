[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llmquant"
version = "0.1.0"
description = "Symmetric RTN W4/W8 x A8/A16 quantization with custom CUDA kernels"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "datasets",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "ninja"]  # ninja is required by torch.utils.cpp_extension.load

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the JIT build compiles these from the installed package
llmquant = ["stages/s4_kernel/csrc/*.cu", "stages/s4_kernel/csrc/*.cpp"]
